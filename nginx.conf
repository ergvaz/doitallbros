# Nginx configuration for DoItAllBros
# Place this file at: /etc/nginx/sites-available/doitallbros

server {
    listen 80;
    listen [::]:80;
    
    server_name doitallbros.com www.doitallbros.com;
    
    root /var/www/html/doitallbros;
    index index.html;
    
    # React Router support - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_comp_level 6;
    
    # Cache static assets for 1 year
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

